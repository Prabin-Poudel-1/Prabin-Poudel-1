name: Generate contribution snake

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Prabin-Poudel-1
          outputs: |
            dist/snake-light.svg?color_snake=%23DC2626&color_dots=%23F8FAFC,%23DBEAFE,%2393C5FD,%2360A5FA,%231D4ED8
            dist/snake-dark.svg?palette=github-dark&color_snake=%23E3BC7B&color_dots=%230D1117,%23212B3D,%23304C67,%235976A0,%239CA6CF

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
